name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $archive = "dsh-astriax-native-$version.zip"
          git archive --format=zip --prefix=dsh-astriax-native/ -o $archive HEAD
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH AstriaX Native ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dsh-astriax-native-${{ github.ref_name }}.zip
            dsh-astriax-native-${{ github.ref_name }}.zip.sha256
